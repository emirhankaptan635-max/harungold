function buildWhatsAppMessage(cart) {
  const lines = cart.map(p => "- " + p.name + " (" + fmt(p.price) + ")");
  const total = cart.reduce((s,p) => s + p.price, 0);
  const text = "Merhaba, aşağıdaki ürünleri sipariş etmek istiyorum:%0A%0A" + lines.join("%0A") + "%0A%0AToplam: " + fmt(total).replace(/ /g,'%20');
  return "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + text;
}

function fmt(n){ return n.toLocaleString('tr-TR') + ' TL'; }

function ProductCard({ p, addToCart }) {
  const discountPct = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : null;
  return (
    <div class="border border-gray-100 rounded-xl p-4 hover:shadow-lg transition flex flex-col relative">
      {discountPct && (
        <span class="absolute top-3 left-3 bg-amber-500 text-white text-xs font-bold px-2 py-1 rounded-full z-10">%{discountPct} İndirim</span>
      )}
      <div class="bg-amber-50 rounded-lg h-40 flex items-center justify-center mb-4 text-5xl overflow-hidden">{p.image ? <img src={p.image} class="w-full h-full object-cover" /> : p.emoji}</div>
      <h3 class="font-semibold text-gray-900 mb-1">{p.name}</h3>
      <p class="text-xs text-gray-500 mb-2">{p.ayar} · {p.gram}</p>
      <div class="flex items-center gap-2 mb-4">
        <span class="text-amber-600 font-bold">{fmt(p.price)}</span>
        {p.oldPrice && <span class="text-gray-400 text-sm line-through">{fmt(p.oldPrice)}</span>}
      </div>
      <button onClick={() => addToCart(p)} class="mt-auto bg-black text-white rounded-lg py-2 text-sm hover:bg-amber-600 transition">Sepete Ekle</button>
    </div>
  );
}

      <div class="flex gap-3 mb-8">
        <button onClick={() => setFilter('all')} class={"px-4 py-2 rounded-full text-sm border " + (filter==='all' ? "bg-amber-500 text-white border-amber-500" : "border-gray-300 text-gray-700")}>Tümü</button>
        <button onClick={() => setFilter('disc')} class={"px-4 py-2 rounded-full text-sm border " + (filter==='disc' ? "bg-amber-500 text-white border-amber-500" : "border-gray-300 text-gray-700")}>İndirimdekiler</button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        {filtered.map(p => <ProductCard key={p.id} p={p} addToCart={addToCart} />)}
      </div>
    </section>
  );
}

function CartPage({ cart, setPage }) {
  const total = cart.reduce((s,p) => s + p.price, 0);
  const sendWhatsApp = () => {
    window.open(buildWhatsAppMessage(cart), "_blank");
  };
  return (
    <section class="max-w-2xl mx-auto px-6 py-16">
      <h2 class="text-2xl font-bold mb-6">Sepetim</h2>
      {cart.length === 0 ? (
        <p class="text-gray-500">Sepetiniz boş.</p>
      ) : (
        <div>
          {cart.map((p,i) => (
            <div key={i} class="flex items-center gap-3 border-b border-gray-100 py-3">
              <span class="w-8 h-8 rounded flex items-center justify-center text-xl overflow-hidden bg-amber-50 flex-shrink-0">{p.image ? <img src={p.image} class="w-full h-full object-cover" /> : p.emoji}</span>
              <span class="flex-1">{p.name}</span>
              <span class="font-medium">{fmt(p.price)}</span>
            </div>
          ))}
          <div class="flex justify-between py-4 font-bold text-lg"><span>Toplam</span><span>{fmt(total)}</span></div>
          <p class="text-sm text-gray-600 mb-4">Siparişinizi WhatsApp üzerinden ileteceksiniz. Ürün listesi ve toplam tutar otomatik olarak mesaja eklenecek; ödeme detayları ekibimiz tarafından WhatsApp'ta size iletilecektir.</p>
          <button onClick={sendWhatsApp} class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg transition flex items-center justify-center gap-2">
            <span class="text-lg">&#128241;</span> WhatsApp Üzerinden Sipariş Ver
          </button>
        </div>
      )}
    </section>
  );
}

function TrackPage() {
  const [code, setCode] = useState('');
  const [status, setStatus] = useState(null);
  const statuses = ["Beklemede","Ödeme Kontrol Ediliyor","Hazırlanıyor","Kargoya Verildi","Teslim Edildi"];
  const check = () => { if(code.trim()) setStatus(statuses[Math.floor(Math.random()*statuses.length)]); };
  return (
    <section class="max-w-md mx-auto px-6 py-24 text-center">
      <h2 class="text-2xl font-bold mb-6">Sipariş Sorgula</h2>
      <input value={code} onChange={e => setCode(e.target.value)} placeholder="KYM-2026-XXXXXX"
        class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-4 text-center" />
      <button onClick={check} class="w-full bg-amber-500 text-white py-3 rounded-lg hover:bg-amber-600 transition">Sorgula</button>
      {status && <p class="mt-6 text-lg font-medium text-amber-600">Durum: {status}</p>}
    </section>
  );
}

function AdminLogin({ onLogin }) {
  const [user, setUser] = useState('');
  const [pass, setPass] = useState('');
  const [error, setError] = useState('');
  const submit = () => {
    if (user === 'ahmetcan29' && pass === 'ahmetcan2921') { setError(''); onLogin(); }
    else setError('Kullanıcı adı veya şifre hatalı.');
  };
  return (
    <section class="max-w-sm mx-auto px-6 py-24">
      <h2 class="text-2xl font-bold mb-6 text-center">Admin Girişi</h2>
      <input value={user} onChange={e => setUser(e.target.value)} placeholder="Kullanıcı adı"
        class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-3" />
      <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="Şifre"
        class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-3" />
      {error && <p class="text-red-500 text-sm mb-3">{error}</p>}
      <button onClick={submit} class="w-full bg-black text-white py-3 rounded-lg hover:bg-amber-600 transition">Giriş Yap</button>
    </section>
  );
}

function ProductFormModal({ product, onSave, onClose }) {
  const [name, setName] = useState(product ? product.name : '');
  const [price, setPrice] = useState(product ? product.price : '');
  const [oldPrice, setOldPrice] = useState(product && product.oldPrice ? product.oldPrice : '');
  const [gram, setGram] = useState(product ? product.gram : '');
  const [ayar, setAyar] = useState(product ? product.ayar : '22K');
  const [emoji, setEmoji] = useState(product ? product.emoji : '\ud83d\udc8d');
  const [image, setImage] = useState(product && product.image ? product.image : null);
  const [imgError, setImgError] = useState('');

  const handleImageUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { setImgError('Lütfen bir görsel dosyası seçin.'); return; }
    if (file.size > 3 * 1024 * 1024) { setImgError('Görsel 3MB\'tan küçük olmalı.'); return; }
    setImgError('');
    const reader = new FileReader();
    reader.onload = (ev) => setImage(ev.target.result);
    reader.readAsDataURL(file);
  };

  const save = () => {
    if (!name.trim() || !price) return;
    onSave({
      id: product ? product.id : Date.now(),
      name: name.trim(),
      price: Number(price),
      oldPrice: oldPrice ? Number(oldPrice) : null,
      gram: gram.trim(),
      ayar,
      emoji,
      image,
    });
  };

  return (
    <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-4">
      <div class="bg-white rounded-xl p-6 max-w-sm w-full max-h-[90vh] overflow-y-auto">
        <h3 class="text-lg font-bold mb-4">{product ? "Ürünü Düzenle" : "Yeni Ürün Ekle"}</h3>
        <label class="block text-xs text-gray-500 mb-1">Ürün Adı</label>
        <input value={name} onChange={e => setName(e.target.value)} class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-3 text-sm" />
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label class="block text-xs text-gray-500 mb-1">Fiyat (TL)</label>
            <input type="number" value={price} onChange={e => setPrice(e.target.value)} class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">İndirim Öncesi (opsiyonel)</label>
            <input type="number" value={oldPrice} onChange={e => setOldPrice(e.target.value)} class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label class="block text-xs text-gray-500 mb-1">Gram</label>
            <input value={gram} onChange={e => setGram(e.target.value)} placeholder="örn. 5 gr" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">Ayar</label>
            <select value={ayar} onChange={e => setAyar(e.target.value)} class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
              <option>14K</option><option>18K</option><option>22K</option><option>24K</option>
            </select>
          </div>
        </div>
        <label class="block text-xs text-gray-500 mb-1">Ürün Görseli</label>
        <div class="flex items-center gap-3 mb-2">
          <div class="w-16 h-16 rounded-lg border border-gray-200 bg-amber-50 flex items-center justify-center overflow-hidden text-3xl">
            {image ? <img src={image} class="w-full h-full object-cover" /> : emoji}
          </div>
          <div class="flex-1">
            <input type="file" accept="image/*" onChange={handleImageUpload} class="text-xs w-full" />
            {image && <button onClick={() => setImage(null)} class="text-xs text-red-500 mt-1 hover:underline">Görseli Kaldır</button>}
          </div>
        </div>
        {imgError && <p class="text-xs text-red-500 mb-2">{imgError}</p>}
        <p class="text-xs text-gray-400 mb-4">Görsel yüklenmezse aşağıdaki simge kullanılır.</p>
        <label class="block text-xs text-gray-500 mb-1">Simge</label>
        <div class="flex gap-2 mb-5">
          {["\ud83d\udc8d","\ud83d\udccf","\u2728","\ud83d\udc8e","\ud83d\udc51","\ud83d\udd17"].map(e => (
            <button key={e} onClick={() => setEmoji(e)} class={"text-2xl w-10 h-10 rounded-lg border flex items-center justify-center " + (emoji===e ? "border-amber-500 bg-amber-50" : "border-gray-200")}>{e}</button>
          ))}
        </div>
        <div class="flex gap-3">
          <button onClick={onClose} class="flex-1 border border-gray-300 text-gray-700 py-2 rounded-lg text-sm">İptal</button>
          <button onClick={save} class="flex-1 bg-black text-white py-2 rounded-lg text-sm hover:bg-amber-600 transition">Kaydet</button>
        </div>
      </div>
    </div>
  );
}

function AdminPanel({ products, setProducts, contact, setContact, onLogout }) {
  const [tab, setTab] = useState('orders');
  const [search, setSearch] = useState('');
  const [editingProduct, setEditingProduct] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [toast, setToast] = useState('');
  const [phoneInput, setPhoneInput] = useState(contact.phone);
  const [emailInput, setEmailInput] = useState(contact.email);
  const [whatsappInput, setWhatsappInput] = useState(contact.whatsapp);

  const orders = [
    { code: "KYM-2026-845921", customer: "A. Yılmaz", total: "10.000 TL", status: "Kargoya Verildi" },
    { code: "KYM-2026-118304", customer: "B. Kaya", total: "6.100 TL", status: "Hazırlanıyor" },
    { code: "KYM-2026-772290", customer: "C. Demir", total: "8.500 TL", status: "Ödeme Kontrol Ediliyor" },
  ];

  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2000); };

  const openNew = () => { setEditingProduct(null); setShowForm(true); };
  const openEdit = (p) => { setEditingProduct(p); setShowForm(true); };
  const closeForm = () => setShowForm(false);

  const saveProduct = (p) => {
    setProducts(prev => {
      const exists = prev.some(x => x.id === p.id);
      return exists ? prev.map(x => x.id === p.id ? p : x) : [...prev, p];
    });
    setShowForm(false);
    flash(editingProduct ? "Ürün güncellendi" : "Ürün eklendi");
  };

  const deleteProduct = (id) => {
    if (!window.confirm("Bu ürünü silmek istediğinize emin misiniz?")) return;
    setProducts(prev => prev.filter(x => x.id !== id));
    flash("Ürün silindi");
  };

  const filteredProducts = products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));

  return (
    <section class="max-w-5xl mx-auto px-6 py-12 relative">
      {toast && (
        <div class="fixed top-6 right-6 bg-black text-white text-sm px-4 py-2 rounded-lg shadow-lg z-50">{toast}</div>
      )}
      {showForm && <ProductFormModal product={editingProduct} onSave={saveProduct} onClose={closeForm} />}
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl font-bold">Admin Panel</h2>
        <button onClick={onLogout} class="text-sm text-amber-600 hover:underline">Çıkış Yap</button>
      </div>
      <div class="flex gap-3 mb-8">
        {[["orders","Siparişler"],["products","Ürünler"],["settings","Ayarlar"]].map(([key,label]) => (
          <button key={key} onClick={() => setTab(key)}
            class={"px-4 py-2 rounded-full text-sm border " + (tab===key ? "bg-amber-500 text-white border-amber-500" : "border-gray-300 text-gray-700")}>
            {label}
          </button>
        ))}
      </div>
      {tab === 'orders' && (
        <div class="overflow-x-auto">
          <table class="w-full text-sm border-collapse">
            <thead>
              <tr class="text-left border-b border-gray-200 text-gray-500">
                <th class="py-2 pr-4">Sipariş Kodu</th><th class="py-2 pr-4">Müşteri</th><th class="py-2 pr-4">Tutar</th><th class="py-2 pr-4">Durum</th>
              </tr>
            </thead>
            <tbody>
              {orders.map(o => (
                <tr key={o.code} class="border-b border-gray-100">
                  <td class="py-3 pr-4 font-medium">{o.code}</td>
                  <td class="py-3 pr-4">{o.customer}</td>
                  <td class="py-3 pr-4">{o.total}</td>
                  <td class="py-3 pr-4">
                    <select class="border border-gray-300 rounded px-2 py-1 text-sm" defaultValue={o.status}>
                      <option>Beklemede</option><option>Ödeme Kontrol Ediliyor</option><option>Hazırlanıyor</option><option>Kargoya Verildi</option><option>Teslim Edildi</option><option>İptal Edildi</option>
                    </select>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {tab === 'products' && (
        <div>
          {(() => {
            const discounted = products.filter(p => p.oldPrice);
            return (
              <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 mb-6 flex flex-wrap gap-6 text-sm">
                <div><span class="text-gray-500">Toplam Ürün:</span> <span class="font-bold">{products.length}</span></div>
                <div><span class="text-gray-500">İndirimli Ürün:</span> <span class="font-bold text-amber-600">{discounted.length}</span></div>
                <div><span class="text-gray-500">Ortalama Fiyat:</span> <span class="font-bold">{products.length ? fmt(Math.round(products.reduce((s,p)=>s+p.price,0)/products.length)) : "-"}</span></div>
              </div>
            );
          })()}
          <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Ürün ara..."
              class="border border-gray-300 rounded-lg px-3 py-2 text-sm w-56" />
            <button onClick={openNew} class="bg-black text-white px-4 py-2 rounded-lg text-sm hover:bg-amber-600 transition">+ Yeni Ürün Ekle</button>
          </div>
          {filteredProducts.length === 0 ? (
            <p class="text-gray-400 text-sm">Ürün bulunamadı.</p>
          ) : (
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
              {filteredProducts.map(p => {
                const discountPct = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : null;
                return (
                  <div key={p.id} class="border border-gray-100 rounded-lg p-4 relative">
                    {discountPct && (
                      <span class="absolute top-2 left-2 bg-amber-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">%{discountPct}</span>
                    )}
                    <div class="bg-amber-50 rounded-lg h-24 flex items-center justify-center text-4xl mb-3 overflow-hidden">{p.image ? <img src={p.image} class="w-full h-full object-cover" /> : p.emoji}</div>
                    <p class="font-medium text-sm mb-1">{p.name}</p>
                    <p class="text-xs text-gray-400 mb-1">{p.ayar} · {p.gram}</p>
                    <div class="flex items-center gap-2 mb-2">
                      <span class="text-amber-600 font-bold text-sm">{fmt(p.price)}</span>
                      {p.oldPrice && <span class="text-gray-400 text-xs line-through">{fmt(p.oldPrice)}</span>}
                    </div>
                    <div class="flex gap-3 text-xs">
                      <button onClick={() => openEdit(p)} class="text-amber-600 font-medium hover:underline">Düzenle</button>
                      <button onClick={() => deleteProduct(p.id)} class="text-red-500 font-medium hover:underline">Sil</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
      {tab === 'settings' && (
        <div class="max-w-sm">
          <h3 class="font-semibold mb-3">İletişim Bilgileri</h3>
          <label class="block text-sm text-gray-600 mb-1">Telefon</label>
          <input value={phoneInput} onChange={e => setPhoneInput(e.target.value)} class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-3" />
          <label class="block text-sm text-gray-600 mb-1">E-posta</label>
          <input value={emailInput} onChange={e => setEmailInput(e.target.value)} class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-3" />
          <label class="block text-sm text-gray-600 mb-1">WhatsApp Numarası (ülke kodu ile, boşluksuz — örn. 905XXXXXXXXX)</label>
          <input value={whatsappInput} onChange={e => setWhatsappInput(e.target.value)} class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4" />
          <button onClick={() => { setContact({ phone: phoneInput, email: emailInput, whatsapp: whatsappInput }); flash("İletişim bilgileri kaydedildi"); }}
            class="bg-amber-500 text-white px-6 py-2 rounded-lg hover:bg-amber-600 transition">Kaydet</button>
        </div>
      )}
    </section>
  );
}

function ContactPage({ contact }) {
  return (
    <section class="max-w-md mx-auto px-6 py-24 text-center">
      <h2 class="text-2xl font-bold mb-6">İletişim</h2>
      <p class="text-gray-600 mb-2">{contact.phone}</p>
      <p class="text-gray-600 mb-8">{contact.email}</p>
      <a href={"https://wa.me/" + contact.whatsapp} target="_blank" class="inline-block bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg transition">WhatsApp Destek</a>
    </section>
  );
}

function App() {
  const [page, setPage] = useState('home');
  const [cart, setCart] = useState([]);
  const [isAdmin, setIsAdmin] = useState(false);
  const [products, setProducts] = useState(DEFAULT_PRODUCTS);
  const [contact, setContact] = useState(DEFAULT_CONTACT);
  const addToCart = (p) => setCart([...cart, p]);
  const isAdminRoute = page === 'adminLogin' || page === 'adminPanel';
  return (
    <div class="min-h-screen flex flex-col">
      {!isAdminRoute && <Header page={page} setPage={setPage} cartCount={cart.length} />}
      <main class="flex-1">
        {page === 'home' && <React.Fragment><Hero setPage={setPage} /><Trust /></React.Fragment>}
        {page === 'products' && <ProductsPage products={products} addToCart={addToCart} />}
        {page === 'cart' && <CartPage cart={cart} setPage={setPage} />}
        {page === 'track' && <TrackPage />}
        {page === 'contact' && <ContactPage contact={contact} />}
        {page === 'adminLogin' && !isAdmin && <AdminLogin onLogin={() => { setIsAdmin(true); setPage('adminPanel'); }} />}
        {page === 'adminPanel' && isAdmin && <AdminPanel products={products} setProducts={setProducts} contact={contact} setContact={setContact} onLogout={() => { setIsAdmin(false); setPage('home'); }} />}
      </main>
      {!isAdminRoute && <Footer setPage={setPage} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
